name: Apply ChatGPT Patch

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: >
      github.event.issue.user.login == github.repository_owner &&
      startsWith(github.event.issue.title, '[CHATGPT PATCH]')

    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Extract patch from issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const body = context.payload.issue.body || '';

            const match = body.match(
              /```(?:diff|patch)\s*\n([\s\S]*?)```/
            );

            if (!match) {
              core.setFailed('No diff/patch block found in issue.');
              return;
            }

            fs.writeFileSync('chatgpt.patch', match[1]);

      - name: Apply patch
        run: |
          git apply --check chatgpt.patch
          git apply chatgpt.patch
          rm chatgpt.patch

      - name: Commit changes
        run: |
          git config user.name "ChatGPT Auto Patch"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Apply ChatGPT requested change"
          git push origin main

      - name: Close issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Patch applied and committed to `main`.'
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });